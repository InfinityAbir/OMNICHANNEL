<div class="settings-shell">
  <nav class="settings-nav">
    <h1>Settings</h1>
    <ul>
      @for (item of items(); track item.path) {
        <li>
          <a [routerLink]="[item.path]" routerLinkActive="active">{{ item.label }}</a>
        </li>
      }
    </ul>
  </nav>
  <div class="settings-content">
    <router-outlet />
  </div>
</div>
