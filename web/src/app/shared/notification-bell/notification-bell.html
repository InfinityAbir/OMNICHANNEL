<div class="bell-wrapper">
  <button type="button" class="bell-btn" (click)="toggle()" [attr.aria-label]="'Notifications' + (unreadCount() > 0 ? ', ' + unreadCount() + ' unread' : '')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>
    @if (unreadCount() > 0) {
      <span class="badge-dot">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
    }
  </button>

  @if (open()) {
    <div class="backdrop" (click)="close()"></div>
    <div class="dropdown">
      <div class="dropdown-header">Notifications</div>
      @if (loading()) {
        <div class="dropdown-empty">Loading…</div>
      } @else if (items().length === 0) {
        <div class="dropdown-empty">No notifications yet.</div>
      } @else {
        <div class="dropdown-list">
          @for (item of items(); track item.id) {
            @if (item.conversationId) {
              <a
                class="notification-item"
                [class.unread]="!item.read"
                [routerLink]="['/inbox', item.conversationId]"
                (click)="markRead(item); close()"
              >
                <span class="item-title">{{ item.title }}</span>
                <span class="item-body">{{ item.body }}</span>
                <span class="item-time">{{ item.createdAt | date: 'short' }}</span>
              </a>
            } @else {
              <button type="button" class="notification-item" [class.unread]="!item.read" (click)="markRead(item)">
                <span class="item-title">{{ item.title }}</span>
                <span class="item-body">{{ item.body }}</span>
                <span class="item-time">{{ item.createdAt | date: 'short' }}</span>
              </button>
            }
          }
        </div>
      }
    </div>
  }
</div>
