name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: omnichannel
          POSTGRES_USER: omnichannel
          POSTGRES_PASSWORD: omnichannel_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnichannel -d omnichannel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMNICHANNEL_TEST_CONNECTION: "Host=localhost;Port=5432;Database=omnichannel;Username=omnichannel;Password=omnichannel_dev_only"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Deterministic, independent of which test project/class happens to run first or in
      # parallel — some tests (e.g. TenantIsolationTests) construct AppDbContext directly and
      # never go through Program.cs's own auto-migrate-on-Testing/Development logic.
      - name: Apply database migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          dotnet ef database update --project src/Omnichannel.Infrastructure --startup-project src/Omnichannel.Api
        env:
          ConnectionStrings__Default: ${{ env.OMNICHANNEL_TEST_CONNECTION }}

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Dependency vulnerability scan
        run: dotnet list package --vulnerable --include-transitive

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Build
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: omnichannel
          POSTGRES_USER: omnichannel
          POSTGRES_PASSWORD: omnichannel_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnichannel -d omnichannel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Apply database migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          dotnet ef database update --project src/Omnichannel.Infrastructure --startup-project src/Omnichannel.Api --no-build --configuration Release
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=omnichannel;Username=omnichannel;Password=omnichannel_dev_only"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
